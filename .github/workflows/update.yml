name: Update picks
on:
  schedule:
    # Times are UTC, set for Eastern Standard Time (Nov 1 through the end of the season)
    - cron: "0 13 * * 2-6"              # Tue-Sat 8am: daily refresh
    - cron: "30 13 * * 0"               # Sun 8:30am: before London games
    - cron: "40,55 16 * * 0"            # Sun 11:40am-12:55pm: after inactives, before 1pm games
    - cron: "10,25,40,55 17 * * 0"
    - cron: "40,55 19 * * 0"            # Sun 2:40-3:55pm: before 4pm games
    - cron: "10,25,40,55 20 * * 0"
    - cron: "50 23 * * 0,1,4"           # 6:50pm Sun/Mon/Thu: before night games
    - cron: "5,20,35,50 0 * * 1,2,5"    # 7:05-7:50pm
    - cron: "5 1 * * 1,2,5"             # 8:05pm, last run before 8:15 kickoffs
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: picks
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python tests/test_all.py
      - name: Build picks
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python pipeline/build_picks.py
      - name: Commit if changed
        run: |
          git config user.name "picks-bot"
          git config user.email "picks-bot@users.noreply.github.com"
          git add docs/data data/snapshots
          git diff --cached --quiet || git commit -m "Update picks $(date -u +%F' '%H:%M)"
          git push
